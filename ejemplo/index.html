<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Bibliotecario</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
    }

    /* --- Menú lateral izquierdo --- */
    .sidebar {
      width: 220px;
      background: #0077b6;
      color: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .sidebar a {
      display: block;
      padding: 12px 15px;
      margin: 8px 0;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .sidebar a:hover {
      background: #00b4d8;
    }

    /* --- Área derecha (contenido con iframe) --- */
    .content {
      flex: 1;
      background: #f4f4f4;
      padding: 10px;
      box-sizing: border-box;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <!-- Menú lateral -->
  <div class="sidebar">
    <h2>Menú</h2>
    <a href="libros.html" target="contenido">📚 Libros</a>
    <a href="penalidades.html" target="contenido">⚠️ Penalidades</a>
    <a href="reservas.html" target="contenido">📅 Reservas</a>
  </div>

  <!-- Área de contenido -->
  <div class="content">
    <!-- Cargamos por defecto la página de libros -->
    <iframe name="contenido" src="libros.html"></iframe>
  </div>
</body>
</html>
